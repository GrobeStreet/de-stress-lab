name: Paid audit intake

on:
  repository_dispatch:
    types:
      - paid-audit-purchased
      - paid-audit-needs-attention
  workflow_dispatch:
    inputs:
      repository_url:
        description: Public GitHub repository URL
        required: true
        type: string
      order_reference:
        description: Non-customer order reference
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paid-audit-${{ github.event.client_payload.order_reference || inputs.order_reference }}
  cancel-in-progress: false

jobs:
  attention:
    if: github.event.action == 'paid-audit-needs-attention'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare private-review notice
        env:
          ORDER_REFERENCE: ${{ github.event.client_payload.order_reference }}
          REASON: ${{ github.event.client_payload.reason }}
        run: |
          mkdir -p delivery
          {
            echo "# Paid audit intake needs review"
            echo
            echo "- Order reference: \`$ORDER_REFERENCE\`"
            echo "- Reason: \`$REASON\`"
            echo
            echo "Review the matching paid Checkout Session privately in Stripe."
          } > delivery/intake-notice.md
      - name: Preserve notice
        uses: actions/upload-artifact@v7
        with:
          name: paid-audit-attention-${{ github.event.client_payload.order_reference }}
          path: delivery
          retention-days: 30

  static-audit:
    if: github.event.action == 'paid-audit-purchased' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORDER_REFERENCE: ${{ github.event.client_payload.order_reference || inputs.order_reference }}
      REPOSITORY_URL: ${{ github.event.client_payload.repository_url || inputs.repository_url }}
    steps:
      - name: Check out the audit tool
        uses: actions/checkout@v7
        with:
          path: auditor
          persist-credentials: false
      - name: Validate intake
        run: |
          python - <<'PY'
          import os
          import re
          from urllib.parse import urlparse

          value = os.environ["REPOSITORY_URL"].strip()
          parsed = urlparse(value)
          parts = [part for part in parsed.path.split("/") if part]
          valid = (
              parsed.scheme == "https"
              and parsed.netloc.lower() == "github.com"
              and not parsed.query
              and not parsed.fragment
              and len(parts) == 2
              and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]{0,38}", parts[0])
              and re.fullmatch(r"[A-Za-z0-9_.-]{1,104}", parts[1])
          )
          if not valid:
              raise SystemExit("Invalid public GitHub repository URL")
          PY
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: auditor/pyproject.toml
      - name: Install the trusted audit tool
        run: python -m pip install ./auditor
      - name: Fetch repository without executing it
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git -c core.hooksPath=/dev/null clone \
            --depth 1 \
            --filter=blob:none \
            --no-tags \
            "$REPOSITORY_URL" target
      - name: Generate static audit
        run: |
          mkdir -p delivery
          timeout 120s destress audit-repo target \
            --json-output delivery/audit.json \
            --markdown-output delivery/audit.md
      - name: Prepare delivery record
        if: always()
        run: |
          python auditor/scripts/prepare_paid_audit_delivery.py \
            --output delivery \
            --target target \
            --repository "$REPOSITORY_URL" \
            --order-reference "$ORDER_REFERENCE"
      - name: Deliver report to the purchaser
        if: always() && github.event.action == 'paid-audit-purchased'
        env:
          AUDIT_DELIVERY_TOKEN: ${{ secrets.AUDIT_DELIVERY_TOKEN }}
          AUDIT_DELIVERY_URL: ${{ vars.AUDIT_DELIVERY_URL }}
        run: python auditor/scripts/send_paid_audit_delivery.py
      - name: Preserve delivery package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paid-audit-${{ env.ORDER_REFERENCE }}
          path: delivery
          if-no-files-found: error
          retention-days: 30
