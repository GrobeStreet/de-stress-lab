name: Paid audit intake

on:
  repository_dispatch:
    types:
      - paid-audit-purchased
      - paid-audit-needs-attention
  workflow_dispatch:
    inputs:
      repository_url:
        description: Public GitHub repository URL
        required: true
        type: string
      order_reference:
        description: Non-customer order reference
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paid-audit-${{ github.event.client_payload.order_reference || inputs.order_reference }}
  cancel-in-progress: false

jobs:
  attention:
    if: github.event.action == 'paid-audit-needs-attention'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare private-review notice
        env:
          ORDER_REFERENCE: ${{ github.event.client_payload.order_reference }}
          REASON: ${{ github.event.client_payload.reason }}
        run: |
          mkdir -p delivery
          {
            echo "# Paid audit intake needs review"
            echo
            echo "- Order reference: \`$ORDER_REFERENCE\`"
            echo "- Reason: \`$REASON\`"
            echo
            echo "Review the matching paid Checkout Session privately in Stripe."
          } > delivery/intake-notice.md
      - name: Preserve notice
        uses: actions/upload-artifact@v7
        with:
          name: paid-audit-attention-${{ github.event.client_payload.order_reference }}
          path: delivery
          retention-days: 30

  static-audit:
    if: github.event.action == 'paid-audit-purchased' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORDER_REFERENCE: ${{ github.event.client_payload.order_reference || inputs.order_reference }}
      REPOSITORY_URL: ${{ github.event.client_payload.repository_url || inputs.repository_url }}
    steps:
      - name: Check out the audit tool
        uses: actions/checkout@v7
        with:
          path: auditor
          persist-credentials: false
      - name: Validate intake
        run: |
          python - <<'PY'
          import os
          import re
          from urllib.parse import urlparse

          value = os.environ["REPOSITORY_URL"].strip()
          parsed = urlparse(value)
          parts = [part for part in parsed.path.split("/") if part]
          valid = (
              parsed.scheme == "https"
              and parsed.netloc.lower() == "github.com"
              and not parsed.query
              and not parsed.fragment
              and len(parts) == 2
              and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]{0,38}", parts[0])
              and re.fullmatch(r"[A-Za-z0-9_.-]{1,104}", parts[1])
          )
          if not valid:
              raise SystemExit("Invalid public GitHub repository URL")
          PY
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: auditor/pyproject.toml
      - name: Install the trusted audit tool
        run: python -m pip install ./auditor
      - name: Fetch repository without executing it
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git -c core.hooksPath=/dev/null clone \
            --depth 1 \
            --filter=blob:none \
            --no-tags \
            "$REPOSITORY_URL" target
      - name: Generate static audit
        run: |
          mkdir -p delivery
          timeout 120s destress audit-repo target \
            --json-output delivery/audit.json \
            --markdown-output delivery/audit.md
      - name: Prepare delivery record
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          output = Path("delivery")
          output.mkdir(exist_ok=True)
          try:
              commit = subprocess.check_output(
                  ["git", "-C", "target", "rev-parse", "HEAD"], text=True
              ).strip()
          except Exception:
              commit = "unavailable"

          scope = f"""# Audit scope

- Order reference: `{os.environ["ORDER_REFERENCE"]}`
- Repository: {os.environ["REPOSITORY_URL"]}
- Audited commit: `{commit}`
- Execution: not attempted

This automated stage performs structural inspection only. It does not execute
customer code, numerically reproduce a claim, or certify scientific validity.
"""
          (output / "scope.md").write_text(scope, encoding="utf-8")
          execution = """# Execution record

Customer code was not executed automatically. Installation and test smoke
checks remain behind the published safety gate and require isolated review.
"""
          (output / "execution.md").write_text(execution, encoding="utf-8")
          manifest = {
              "schema_version": 1,
              "order_reference": os.environ["ORDER_REFERENCE"],
              "repository": os.environ["REPOSITORY_URL"],
              "commit": commit,
              "static_audit": (output / "audit.json").exists(),
              "customer_code_executed": False,
          }
          (output / "delivery-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Preserve delivery package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paid-audit-${{ env.ORDER_REFERENCE }}
          path: delivery
          if-no-files-found: error
          retention-days: 30
