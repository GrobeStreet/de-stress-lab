name: Reproducibility audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run reproducibility audit
        id: audit
        uses: ./
        with:
          minimum-score: "90"
      - name: Preserve audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproducibility-audit
          path: |
            destress-audit.json
            destress-audit.md
