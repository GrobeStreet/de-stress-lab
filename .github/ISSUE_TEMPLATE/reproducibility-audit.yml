name: Reproducibility audit
description: Request an independent computational reproduction.
title: "[Reproduction] "
labels: ["engagement", "reproducibility"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include confidential files, credentials, or unpublished data.

        For the fixed-scope $199 repository audit, review the offer and checkout:
        https://github.com/GrobeStreet/de-stress-lab/blob/main/docs/PAID_AUDIT.md
  - type: input
    id: field
    attributes:
      label: Research field
    validations:
      required: true
  - type: textarea
    id: artifact
    attributes:
      label: Public paper, repository, or artifact
      description: Provide public links only.
    validations:
      required: true
  - type: textarea
    id: claims
    attributes:
      label: Results that must be reproduced
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Desired deadline
  - type: dropdown
    id: private
    attributes:
      label: Is private scoping required?
      options:
        - "No"
        - "Yes — contact details will be exchanged privately"
    validations:
      required: true
